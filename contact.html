<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.png" />
    <title>צור קשר | אהד גולד</title>
    <link href="/styles/reset.css" rel="stylesheet" />
    <link href="/styles/main.css" rel="stylesheet" />
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="brand">אהד גולד <span>שיעורים פרטיים</span></a>
      <nav>
        <ul id="navMenu" class="nav-menu">
          <li class="close-item">
            <button id="closeMenuBtn" class="close-btn" aria-label="סגירת התפריט">
              <img src="/icons/close.svg" alt="" />
            </button>
          </li>
          <li><a href="index.html">דף הבית</a></li>
          <li><a href="contact.html">צור קשר</a></li>
          <li><a href="courses.html">רשימת הקורסים</a></li>
        </ul>
      </nav>
      <button id="openMenuBtn" class="hamburger-btn" aria-label="פתיחת התפריט">
        <img src="/icons/menu.svg" alt="" />
      </button>
    </header>

    <main class="page container">
      <div class="page-intro">
        <h1>צור קשר</h1>
        <p>רוצים לתאם שיעור? השאירו פרטים ואחזור אליכם בהקדם.</p>
      </div>

      <!-- ===================================================== -->
      <!-- ⚠️ שים לב: הטופס כרגע לא שולח את הפרטים לשום מקום — הוא רק מציג הודעת תודה. -->
      <!--    כדי לקבל את הפניות בפועל, חבר אותו לשירות כמו Formspree / Google Forms. -->
      <!-- ===================================================== -->
      <form id="contactForm" class="contact-form" action="https://api.web3forms.com/submit" method="POST">
        <!-- Web3Forms: submissions are emailed to the address this key was created with -->
        <input type="hidden" name="access_key" value="11676a66-3a52-4a60-a71f-7f7d7e83295b" />
        <input type="hidden" name="subject" value="פנייה חדשה מהאתר" />
        <input type="hidden" name="from_name" value="טופס יצירת קשר - האתר" />
        <!-- Spam trap: real users never see or fill this -->
        <input type="checkbox" name="botcheck" class="hidden" style="display: none;" />

        <div class="form-row">
          <div class="form-field">
            <label for="firstName">שם פרטי</label>
            <input type="text" id="firstName" name="firstName" autocomplete="given-name" required />
          </div>
          <div class="form-field">
            <label for="lastName">שם משפחה</label>
            <input type="text" id="lastName" name="lastName" autocomplete="family-name" required />
          </div>
        </div>

        <div class="form-field">
          <label for="email">אימייל</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com" dir="ltr" required />
        </div>

        <div class="form-field">
          <label for="phone">מספר טלפון</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="050-1234567" dir="ltr"
                 pattern="0[0-9]{1,2}-?[0-9]{7}" title="מספר טלפון ישראלי, למשל 050-1234567" required />
        </div>

        <div class="form-field">
          <label for="course">באיזה קורס אתה מעוניין?</label>
          <select id="course" name="course" required>
            <option value="" disabled selected>בחרו קורס</option>
            <!-- ✍️ הכנס כאן את שמות הקורסים שלך (כדאי שיתאימו לרשימה ב-courses.html) -->
            <option>לינארית 1</option>
            <option>מתמטיקה דיסקרטית</option>
            <option>אלגוריתמים</option>
            <option>חישוביות</option>
            <option>אחר / עדיין לא בטוח</option>
          </select>
        </div>

        <button type="submit" class="btn">שליחה</button>
        <p id="formMessage" class="form-message" role="status" hidden></p>
      </form>
    </main>

    <footer class="site-footer">
      <p>שיעורים פרטיים אהד גולד · product jam 2027</p>
    </footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
